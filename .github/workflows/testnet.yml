name: testnet

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-activity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Daily testnet activity (dedicated testnet-only wallet)
        env:
          TESTNET_EVM_KEY: ${{ secrets.TESTNET_EVM_KEY }}
        run: node watcher/testnet.mjs

      - name: Commit activity log
        run: |
          git config user.name "penniless-watcher"
          git config user.email "actions@users.noreply.github.com"
          git add TESTNET.md watcher/.testnet-state.json
          git diff --cached --quiet || git commit -m "testnet: daily activity $(date -u '+%Y-%m-%d')"
          git push
