name: watcher

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run keyless checks (wallets + rails)
        id: check
        env:
          SUPERTTEAM_API_KEY: ${{ secrets.SUPERTTEAM_API_KEY }}
        run: node watcher/check.mjs

      - name: Commit status page
        run: |
          git config user.name "penniless-watcher"
          git config user.email "actions@users.noreply.github.com"
          git add STATUS.md watcher/.state.json
          git rm --cached .watcher-alarm 2>/dev/null || true
          if [ -f .watcher-alarm ]; then git add .watcher-alarm; fi
          git diff --cached --quiet || git commit -m "watcher: status update $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push

      - name: Fail loudly on a win/payment (triggers GitHub email)
        run: |
          if [ -f .watcher-alarm ]; then
            echo "::error::$(cat .watcher-alarm) — a payment arrived. Check the wallet and LOG."
            exit 1
          fi
